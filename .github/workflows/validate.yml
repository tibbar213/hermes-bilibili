name: Validate plugin project
on:
  push:
  pull_request:
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/package.py --check
      - run: python scripts/package.py
      # Runtime integration tests require an installed Hermes environment.
